[project]
name = "mcp-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhmrya", email = "abhmrya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.10,<2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-lab = "mcp_lab:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
