
services:
  postgres:
    image: postgres:17
    container_name: mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: mcpuser
      POSTGRES_PASSWORD: mcp_password_123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
